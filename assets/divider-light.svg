    </clipPath>
    <linearGradient id="div-pulse-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.9"/>
      <stop offset="65%" stop-color="#4f46e5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
